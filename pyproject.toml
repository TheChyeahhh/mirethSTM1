[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mirethstm"
version = "0.1.0"
description = "MirethSTM1: a free, Jev-style decision engine that scores typed answers with a local model."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Mireth AI" }]
dependencies = [
    "torch>=2.9",
    "transformers>=5.18,<6",
    "numpy",
]

[project.optional-dependencies]
bench = ["datasets>=4", "matplotlib"]
dev = ["pytest"]

[project.scripts]
mirethstm = "mirethstm.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mirethstm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["model: loads Qwen/Qwen3-0.6B on CPU (slow)"]
